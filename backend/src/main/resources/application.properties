# Porta di ascolto del server applicativo
server.port=8080

# Connessione al database PostgreSQL (slide: Persistence Tier, DBMS Postgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/coinquilini
spring.datasource.username=postgres
spring.datasource.password=tabledroppers
spring.datasource.driver-class-name=org.postgresql.Driver

# Inizializzazione automatica dello schema all'avvio (slide: Persistence Tier)
spring.sql.init.mode=always

# Configurazione della sessione tramite cookie (slide: Stateful Applications: Cookies)
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=7d
